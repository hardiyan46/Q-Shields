nodes:
  # Wazuh Indexer single-node certificate
  indexer:
    - name: wazuh.indexer
      ip: "wazuh.indexer"

  # Wazuh Manager (Server + Filebeat) certificate
  server:
    - name: wazuh.manager
      ip: "wazuh.manager"

  # Wazuh Dashboard certificate
  dashboard:
    - name: wazuh.dashboard
      ip: "wazuh.dashboard"
