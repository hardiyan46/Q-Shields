# ==============================================================================
# Q-Shields Wazuh Single-Node Stack (Manager, Indexer, Dashboard - Wazuh 4.9.2)
# ==============================================================================
# Stack ini TERPISAH dari `docker-compose.app.yml`.
# Prasyarat sebelum menjalankan pertama kali:
#   1. Salin `.env.example` menjadi `.env` dan isi `INDEXER_PASSWORD`, `API_PASSWORD`, dll.
#   2. Generate sertifikat TLS internal terlebih dahulu:
#        docker compose -f docker-compose.wazuh-certs.yml run --rm generator
#   3. Jalankan stack Wazuh:
#        docker compose -f docker-compose.wazuh.yml up -d
# ==============================================================================

services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: qshields-wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      # Batasi heap JVM agar aman di host Docker Desktop / RAM terbatas
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer-key.pem:ro
      - ./wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sk -u \"${INDEXER_USERNAME}:${INDEXER_PASSWORD}\" https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - wazuh_net

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: qshields-wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ports:
      # Komunikasi event Wazuh Agent (Linux, Windows, macOS)
      - "1514:1514/tcp"
      # Registrasi / enrollment Wazuh Agent
      - "1515:1515/tcp"
      # Opsional penerima syslog eksternal
      - "514:514/udp"
      # Bind API 55000 hanya ke localhost untuk debugging; backend Q-Shields akses via wazuh_net
      - "127.0.0.1:55000:55000"
    environment:
      INDEXER_URL: "https://wazuh.indexer:9200"
      INDEXER_USERNAME: ${INDEXER_USERNAME}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: "full"
      SSL_CERTIFICATE_AUTHORITIES: "/etc/ssl/root-ca.pem"
      SSL_CERTIFICATE: "/etc/ssl/filebeat.pem"
      SSL_KEY: "/etc/ssl/filebeat.key"
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_data:/var/ossec/data
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # Mount skrip Active Response kustom Q-Shields agar mudah dikelola
      - ./wazuh/active-response:/var/ossec/active-response/bin/qshields
      # Mount konfigurasi Wazuh Manager (vulnerability-detection & SCA aktif)
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
    networks:
      - wazuh_net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: qshields-wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: "https://wazuh.indexer:9200"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem"
      SERVER_SSL_KEY: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem"
      WAZUH_API_URL: "https://wazuh.manager"
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - ./wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh/config/wazuh_dashboard/wazuh.dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks:
      - wazuh_net

volumes:
  wazuh-indexer-data:
  wazuh_api_configuration:
  wazuh_data:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:

networks:
  # Jaringan terisolasi untuk stack Wazuh; hanya container `backend` Q-Shields yang terhubung ke sini
  wazuh_net:
    name: wazuh_net
    driver: bridge
