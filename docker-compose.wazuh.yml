name: qshields-wazuh

# ==============================================================================
# Q-Shields Wazuh Single-Node Stack (Manager, Indexer, Dashboard - Wazuh 4.9.2)
# ==============================================================================
# Stack ini TERPISAH dari `docker-compose.app.yml` (`name: qshields-app`).
# Fresh install otomatis menghasilkan sertifikat TLS internal melalui service
# `wazuh.certs` jika `./wazuh/certs/root-ca.pem` belum tersedia.
# Disarankan menjalankan lewat helper:
#   - Linux   : ./scripts/setup-wazuh.sh
#   - Windows : powershell -ExecutionPolicy Bypass -File .\scripts\setup-wazuh.ps1
# Atau manual:
#   docker compose --env-file .env -f docker-compose.wazuh.yml up -d
# ==============================================================================

services:
  wazuh.certs:
    image: wazuh/wazuh-certs-generator:0.0.2
    container_name: qshields-wazuh-certs
    hostname: wazuh.certs
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        find /host-certs -maxdepth 1 -type d \( -name "*.pem" -o -name "*.key" \) -exec rm -rf {} + 2>/dev/null || true
        if [ -f /certificates/root-ca.pem ] && [ -f /certificates/wazuh.indexer.pem ] && [ -f /certificates/wazuh.manager.pem ] && [ -f /certificates/wazuh.dashboard.pem ]; then
          echo "[wazuh.certs] Sertifikat TLS sudah ada di volume wazuh_certs, melewati pembuatan ulang."
        else
          echo "[wazuh.certs] Membuat sertifikat TLS internal Wazuh ke volume wazuh_certs..."
          /entrypoint.sh
          if [ ! -f /certificates/root-ca-manager.pem ] && [ -f /certificates/root-ca.pem ]; then
            cp -f /certificates/root-ca.pem /certificates/root-ca-manager.pem
          fi
        fi
        chmod 0755 /certificates
        chown 1000:1000 /certificates/wazuh.indexer*.pem /certificates/wazuh.dashboard*.pem /certificates/admin*.pem 2>/dev/null || true
        chmod 0600 /certificates/wazuh.indexer*.pem /certificates/wazuh.dashboard*.pem /certificates/admin*.pem 2>/dev/null || true
        chmod 0644 /certificates/root-ca*.pem /certificates/wazuh.manager*.pem 2>/dev/null || true
        cp -f /certificates/*.pem /certificates/*.key /host-certs/ 2>/dev/null || true
    volumes:
      - wazuh_certs:/certificates
      - ./wazuh/certs:/host-certs
      - ./wazuh/config/certs.yml:/config/certs.yml:ro
    networks:
      - wazuh_net

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: qshields-wazuh-indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    depends_on:
      wazuh.certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      # Batasi heap JVM agar aman di host Docker Desktop / RAM terbatas
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      INDEXER_USERNAME: ${INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-SecretPassword}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh_certs:/usr/share/wazuh-indexer/certs:ro
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sk -u \"${INDEXER_USERNAME:-admin}:${INDEXER_PASSWORD:-SecretPassword}\" https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - wazuh_net

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: qshields-wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh.certs:
        condition: service_completed_successfully
      wazuh.indexer:
        condition: service_healthy
    ports:
      # Komunikasi event Wazuh Agent (Linux, Windows, macOS)
      - "1514:1514/tcp"
      # Registrasi / enrollment Wazuh Agent
      - "1515:1515/tcp"
      # Opsional penerima syslog eksternal
      - "514:514/udp"
      # Bind API 55000 hanya ke localhost untuk debugging; backend Q-Shields akses via wazuh_net
      - "127.0.0.1:55000:55000"
    environment:
      INDEXER_URL: "https://wazuh.indexer:9200"
      INDEXER_USERNAME: ${INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-SecretPassword}
      FILEBEAT_SSL_VERIFICATION_MODE: "full"
      SSL_CERTIFICATE_AUTHORITIES: "/etc/ssl/wazuh/root-ca.pem"
      SSL_CERTIFICATE: "/etc/ssl/wazuh/wazuh.manager.pem"
      SSL_KEY: "/etc/ssl/wazuh/wazuh.manager-key.pem"
      API_USERNAME: ${API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_data:/var/ossec/data
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      # Mount skrip Active Response kustom Q-Shields agar mudah dikelola
      - ./wazuh/active-response:/var/ossec/active-response/bin/qshields
      # Mount konfigurasi Wazuh Manager (vulnerability-detection & SCA aktif)
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - wazuh_certs:/etc/ssl/wazuh:ro
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - wazuh_net

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: qshields-wazuh-dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh.certs:
        condition: service_completed_successfully
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      INDEXER_USERNAME: ${INDEXER_USERNAME:-admin}
      INDEXER_PASSWORD: ${INDEXER_PASSWORD:-SecretPassword}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-kibanaserver}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-kibanaserver}
      OPENSEARCH_HOSTS: "https://wazuh.indexer:9200"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard.pem"
      SERVER_SSL_KEY: "/usr/share/wazuh-dashboard/certs/wazuh.dashboard-key.pem"
      WAZUH_API_URL: "https://wazuh.manager"
      API_USERNAME: ${API_USERNAME:-wazuh-wui}
      API_PASSWORD: ${API_PASSWORD:-MyS3cr37P450r.*-}
    volumes:
      - wazuh_certs:/usr/share/wazuh-dashboard/certs:ro
      - ./wazuh/config/wazuh_dashboard/wazuh.dashboard.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    healthcheck:
      test: ["CMD-SHELL", "curl -skI https://localhost:5601 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - wazuh_net

volumes:
  wazuh_certs:
  wazuh-indexer-data:
  wazuh_api_configuration:
  wazuh_data:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:

networks:
  # Jaringan terisolasi untuk stack Wazuh; hanya container `backend` Q-Shields yang terhubung ke sini
  wazuh_net:
    name: wazuh_net
    driver: bridge