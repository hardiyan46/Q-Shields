name: qshields-wazuh-certs

# ==============================================================================
# Generator Sertifikat TLS Internal Wazuh Single-Node (Manual Standalone)
# Catatan: `docker-compose.wazuh.yml` kini sudah menyertakan init service
# `wazuh.certs` otomatis saat fresh install. File ini dipertahankan untuk
# keperluan regenerasi manual jika ./wazuh/certs dihapus:
#   docker compose -f docker-compose.wazuh-certs.yml run --rm generator
# Hasil sertifikat disimpan di `./wazuh/certs/` (diabaikan oleh .gitignore).
# ==============================================================================

services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.2
    container_name: qshields-wazuh-certs-generator
    volumes:
      - ./wazuh/certs:/certificates
      - ./wazuh/config/certs.yml:/config/certs.yml:ro